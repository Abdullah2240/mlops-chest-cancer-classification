stages:
  data_ingestion:
    cmd: python src/chestCancerClassifier/pipeline/stage_01_data_ingestion.py
    deps:
      - src/chestCancerClassifier/pipeline/stage_01_data_ingestion
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/Chest_CT_scan_Data
  
  prepare_base_model:
    cmd: python src/chestCancerClassifier/pipeline/stage_02_prepare_base_model.py
    deps:
      - src/chestCancerClassifier/pipeline/stage_02_prepare_base_model
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      -  LEARNING_RATE
    outs:
      - artifacts/prepare_base_model

  model_trainer:
    cmd: python src/chestCancerClassifier/pipeline/stage_03_model_training.py
    deps:
      - src/chestCancerClassifier/pipeline/stage_03_model_training
      - config/config.yaml
      - artifacts/data_ingestion/Chest_CT_scan_Data
      - artifacts/prepare_base_model
    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
    outs:
      - artifacts/training/model.h5

model_evaluation:
  cmd: python src/chestCancerClassifier/pipeline/stage_04_model_evaluation
  deps:
    - src/chestCancerClassifier/pipeline/stage_04_model_evaluation
    - config/config.yaml
    -  artifacts/data_ingestion/Chest_CT_scan_Data
    - artifacts/training/model.h5
  params:
    - BATCH_SIZE
    - IMAGE_SIZE
  metrics:
  - scores.json:
      cache: false



